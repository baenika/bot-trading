# Copia este archivo como config.yaml y rellénalo.

mode: paper            # paper = dinero ficticio. El modo real NO está activado (ver README).

symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
timeframe: 1h          # 15m, 30m, 1h, 2h, 4h, 1d

account:
  starting_equity: 10000     # capital ficticio inicial
  fee_pct: 0.1               # comisión por lado (Binance spot ≈ 0,1%)
  slippage_pct: 0.05         # deslizamiento en órdenes a mercado y stops
  max_bars_in_trade: 48      # cierra el trade si no ha tocado SL/TP en N velas
  wait_bars: 6               # cuánto espera una orden de "ESPERAR" antes de cancelarse

telegram:
  chat_id: ""                # id del grupo (empieza por -100...). Usa get_chat_id.py
  private_chat_id: ""        # tu chat privado con el bot: panel, avisos y comandos (/panel, /stop...)
  private_bot_token: ""      # opcional: bot distinto para el chat privado. Vacío = usa el del Risk
  delay_seconds: 1.2
  tokens:                    # un bot de @BotFather para cada personaje
    scout: "PON_AQUI_EL_TOKEN"
    news: "PON_AQUI_EL_TOKEN"
    chart: "PON_AQUI_EL_TOKEN"
    sentimental: "PON_AQUI_EL_TOKEN"
    skeptic: "PON_AQUI_EL_TOKEN"
    risk: "PON_AQUI_EL_TOKEN"

llm:                         # opcional: Claude lee las noticias y explica el movimiento
  anthropic_api_key: ""
  model: claude-haiku-5-5

bots:
  scout:
    min_vol_z: 2.0           # volumen mínimo (desviaciones sobre lo normal)
    min_range_atr: 1.6       # vela mínima medida en ATR
    min_strength: 45         # fuerza mínima para dar la alerta (0-100)
  news:
    max_age_hours: 12
    feeds:
      - https://www.coindesk.com/arc/outboundfeeds/rss/
      - https://cointelegraph.com/rss
      - https://decrypt.co/feed
  chart:
    rr_target: 2.0           # objetivo = 2 veces lo que se arriesga
    min_sl_atr: 1.0
    max_sl_atr: 3.0
    swing_bars: 5
  sentimental:
    max_ext_atr: 3.0         # más de 3 ATR lejos de la EMA20 = perseguir el precio
    rsi_hot: 75
    rsi_cold: 25
    max_streak: 5
    loss_streak_block: 3     # tras 3 pérdidas seguidas, pausa
    study_horizon: 12        # el estudio histórico mira N velas hacia delante
    study_min_cases: 15
    sim_paths: 10000         # máquina del tiempo (solo informativo): futuros simulados
    sim_horizon: 48          # velas hacia delante (igual que max_bars_in_trade)
  skeptic:
    min_rr: 1.8
    approve_score: 3.0       # puntuación para COMPRAR
    wait_score: 1.0          # puntuación para ESPERAR (por debajo: PASAR)
    max_risk_pct: 6.0
    min_study_win: 45
    allow_short: false       # true solo si operas futuros
  risk:
    risk_per_trade_pct: 1.0
    daily_loss_limit_pct: 3.0
    max_drawdown_pct: 15.0
    max_open_positions: 3
    max_leverage: 1.0

# ───────────── MESA MEMECOINS (Solana) ─────────────
memes:
  starting_equity: 1000        # capital ficticio de esta mesa
  every_seconds: 60            # cada cuánto mira el mercado
  scan_limit: 60               # tokens nuevos por vuelta
  group_chat_id: ""            # grupo de Telegram para esta mesa (vacío = el mismo grupo)
  private_bot_token: ""        # un 7º bot para tu chat privado de memes (/panel, /stop...)
  params:
    min_age_min: 30            # edad del par: entre 30 min…
    max_age_min: 4320          # …y 72 h
    min_mcap: 300000
    max_mcap: 20000000
    min_liq: 40000             # descarta liquidez < 40k
    min_vol_h1: 50000          # descarta volumen 1h < 50k
    max_top10_pct: 25          # descarta si los 10 mayores tienen > 25%
    max_dev_pct: 3             # descarta si el creador tiene > 3%
    max_bundled_pct: 10
    min_lp_locked_pct: 90      # liquidez bloqueada o quemada
    max_chg_h1_already: 80     # descarta si ya ha subido > 80% en 1h
    require_safety_data: true  # sin datos de seguridad = descartado
    min_score: 70              # el Skeptic solo deja pasar 70+
    fomo_chg_m5: 25
    stop_pct: 6
    trail_start_pct: 12
    trail_pct: 8
    max_hold_min: 360
    max_position_pct: 8
    risk_cap_pct: 1.0
    max_open: 4
    daily_loss_pct: 6
    max_drawdown_pct: 25
    fee_pct: 1.0
